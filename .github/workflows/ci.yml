# CI: runs on every push to main and every pull request, on GitHub-hosted runners only.
# Security rules for this repo (public, with a self-hosted deploy runner):
#   - never use pull_request_target
#   - CI jobs never run on the self-hosted runner
#   - third-party actions are pinned to a full commit SHA (the tag is in the comment)
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job's GITHUB_TOKEN can only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

  test:
    name: Test
    needs: lint            # fail fast: no database is started if lint fails
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16  # same major version as the RDS instance (dev/prod parity)
        env:
          POSTGRES_USER: shortify
          POSTGRES_PASSWORD: shortify
          POSTGRES_DB: shortify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://shortify:shortify@localhost:5432/shortify

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q -p no:cacheprovider

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform 1.16.4
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"   # same as the laptop; matches required_version ~> 1.16.0
          terraform_wrapper: false      # plain terraform CLI, no output wrapper

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialize (no backend; the committed lock file must match)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate

      # The bootstrap root (state bucket) gets the same three checks. Steps, not a
      # matrix: a matrix would rename the required "Terraform" check.
      - name: Check formatting (bootstrap)
        working-directory: infra/bootstrap
        run: terraform fmt -check -recursive -diff

      - name: Initialize (bootstrap, no backend; the committed lock file must match)
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate (bootstrap)
        working-directory: infra/bootstrap
        run: terraform validate

  scripts:
    name: Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned and checksum-verified like everything else: the image ships its own,
      # older ShellCheck, and a new version can add warnings with no code change.
      - name: Install ShellCheck 0.11.0
        run: |
          curl -sSfL -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: ShellCheck
        run: shellcheck -x scripts/*.sh tests/scripts/run.sh tests/scripts/fakes/*

      - name: Script tests (fake CLIs)
        run: bash tests/scripts/run.sh
