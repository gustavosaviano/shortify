# CI: runs on every push to main and every pull request, on GitHub-hosted runners only.
# After the four checks pass on a push to main, the Dispatch deploy job asks the private
# gustavosaviano/shortify-deploy to release that commit (runbook section 12).
# Security rules for this repo (public, with a self-hosted deploy runner):
#   - never use pull_request_target
#   - CI jobs never run on the self-hosted runner
#   - third-party actions are pinned to a full commit SHA (the tag is in the comment)
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job's GITHUB_TOKEN can only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

  test:
    name: Test
    needs: lint            # fail fast: no database is started if lint fails
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16  # same major version as the RDS instance (dev/prod parity)
        env:
          POSTGRES_USER: shortify
          POSTGRES_PASSWORD: shortify
          POSTGRES_DB: shortify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://shortify:shortify@localhost:5432/shortify

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q -p no:cacheprovider

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform 1.16.4
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"   # same as the laptop; matches required_version ~> 1.16.0
          terraform_wrapper: false      # plain terraform CLI, no output wrapper

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialize (no backend; the committed lock file must match)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate

      # The bootstrap root (state bucket) gets the same three checks. Steps, not a
      # matrix: a matrix would rename the required "Terraform" check.
      - name: Check formatting (bootstrap)
        working-directory: infra/bootstrap
        run: terraform fmt -check -recursive -diff

      - name: Initialize (bootstrap, no backend; the committed lock file must match)
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate (bootstrap)
        working-directory: infra/bootstrap
        run: terraform validate

  scripts:
    name: Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned and checksum-verified like everything else: the image ships its own,
      # older ShellCheck, and a new version can add warnings with no code change.
      - name: Install ShellCheck 0.11.0
        run: |
          curl -sSfL -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: ShellCheck
        run: shellcheck -x scripts/*.sh tests/scripts/run.sh tests/scripts/fakes/*

      - name: Script tests (fake CLIs)
        run: bash tests/scripts/run.sh

  # Starts the deploy of this commit in the private repo, whose self-hosted runner does the
  # release (knowledge base: why the deploy runner lives in a separate private repo).
  # Only on a push to main and only after the four checks pass: a pull request never deploys,
  # and a fork's workflow never gets the secret. The token is a fine-grained PAT that can only
  # start workflows in shortify-deploy (Actions: write there, nothing else); the deploy job
  # re-checks the commit itself, so the token can't deploy anything but main's head.
  dispatch:
    name: Dispatch deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, terraform, scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # API version pinned: with 2026-03-10 a dispatch answers 200 with the new run's ID; an
      # older version answers an empty 204, which proves nothing (edge case #71).
      - name: Start the deploy in shortify-deploy
        env:
          TOKEN: ${{ secrets.SHORTIFY_DEPLOY_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secret SHORTIFY_DEPLOY_DISPATCH_TOKEN is not set"
            exit 1
          fi
          code=$(curl -sS -o "$RUNNER_TEMP/dispatch.json" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -d "{\"ref\":\"main\",\"inputs\":{\"sha\":\"$SHA\"}}" \
            https://api.github.com/repos/gustavosaviano/shortify-deploy/actions/workflows/deploy.yml/dispatches)
          run_id=$(jq -r '.workflow_run_id // empty' "$RUNNER_TEMP/dispatch.json")
          if [ "$code" != 200 ] || [ -z "$run_id" ]; then
            echo "::error::dispatch failed: HTTP $code, $(jq -r '.message // "no message"' "$RUNNER_TEMP/dispatch.json")"
            exit 1
          fi
          echo "deploy of ${SHA:0:7} started: shortify-deploy run $run_id"
          echo "Deploy of ${SHA:0:7} started: shortify-deploy run $run_id." >> "$GITHUB_STEP_SUMMARY"
