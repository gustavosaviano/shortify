# Shortify Ansible settings. On this laptop the repo is on a Windows drive where every
# directory looks world-writable (edge case #39), so Ansible refuses this file as a
# current-directory config (edge case #50): scripts/shortify-env.sh exports ANSIBLE_CONFIG.
[defaults]
# Explicit, not discovered: a second Python on the host must not change what runs the deploy.
interpreter_python = /usr/bin/python3
# Default to the emulator: a default can then only ever hit Floci; AWS always needs an explicit -i.
inventory = inventories/floci/hosts.yml
