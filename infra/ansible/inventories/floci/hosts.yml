# Floci environment (this laptop only). Every instance shares 127.0.0.1 and gets its own
# SSH host port, which changes on every replacement (edge case #21): derive it from the
# current instance, never type it. INSTANCE_ID comes from scripts/shortify-env.sh.
all:
  children:
    app:
      hosts:
        shortify-app:
          ansible_host: 127.0.0.1
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/shortify-real
          ansible_port: "{{ lookup('ansible.builtin.pipe', 'docker port floci-ec2-' ~ lookup('ansible.builtin.env', 'INSTANCE_ID', default=undef(hint='INSTANCE_ID is not set: run shortify_up or source scripts/shortify-env.sh')) ~ ' 22/tcp') | regex_search('\\d+$', multiline=True) }}"
