# Configures the Shortify app host. Same playbook for Floci and AWS; the inventory
# carries the environment differences.
- name: Refuse to run with no target hosts
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Fail if the inventory has no app hosts (Ansible itself only warns and exits 0)
      ansible.builtin.assert:
        that: groups['app'] | default([]) | length > 0
        fail_msg: >-
          No hosts in group 'app', so the inventory wasn't loaded. On this laptop run
          shortify_up or source scripts/shortify-env.sh, which sets ANSIBLE_CONFIG (edge case #50).
        quiet: true

- name: Configure the Shortify app host
  hosts: app
  gather_facts: false # facts need Python on the host, which the first task guarantees
  vars:
    app_root: /opt/shortify
    app_user: shortify
    repo_root: "{{ playbook_dir }}/../.."
    release_dir: "{{ app_root }}/releases/{{ release_commit.stdout }}"
    # One command for the systemd unit and the Floci launcher, so the two paths cannot drift.
    app_command: "{{ release_dir }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ tf.app_port.value }}"
  tasks:
    - name: Ensure Python is present (modules need it; never rely on the image, edge case #9)
      ansible.builtin.raw: |
        if [ -x /usr/bin/python3 ]; then echo present
        else apt-get update -q && apt-get install -y -q python3 && echo installed; fi
      register: python_bootstrap
      changed_when: "'installed' in python_bootstrap.stdout"

    - name: Gather facts
      ansible.builtin.setup:

    - name: Install OS packages the app needs
      ansible.builtin.apt:
        name: [python3-venv]
        update_cache: true
        cache_valid_time: 3600

    # ── The release: exactly the committed code, built on the laptop ──────────
    - name: Read the commit to deploy
      ansible.builtin.command: git -C "{{ repo_root }}" rev-parse HEAD
      delegate_to: localhost
      run_once: true
      register: release_commit
      changed_when: false

    - name: Refuse uncommitted app changes (git archive would silently deploy the old code)
      ansible.builtin.command: git -C "{{ repo_root }}" status --porcelain -- app requirements.txt
      delegate_to: localhost
      run_once: true
      register: app_dirty
      changed_when: false
      failed_when: app_dirty.stdout != ""

    - name: Package the release from git (git's file modes, no working-tree leftovers)
      ansible.builtin.command: >-
        git -C "{{ repo_root }}" -c tar.umask=0022 archive --format=tar.gz
        -o /tmp/shortify-{{ release_commit.stdout }}.tar.gz {{ release_commit.stdout }} app requirements.txt
      args:
        creates: /tmp/shortify-{{ release_commit.stdout }}.tar.gz
      delegate_to: localhost
      run_once: true

    # ── On the host ───────────────────────────────────────────────────────────
    - name: Create the app user (no login; the app never runs as root)
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ app_root }}"
        create_home: false

    - name: Create the release directory (root-owned, so the app can't rewrite its own code)
      ansible.builtin.file:
        path: "{{ app_root }}/releases/{{ release_commit.stdout }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Unpack the release
      ansible.builtin.unarchive:
        src: /tmp/shortify-{{ release_commit.stdout }}.tar.gz
        dest: "{{ app_root }}/releases/{{ release_commit.stdout }}"
        creates: "{{ app_root }}/releases/{{ release_commit.stdout }}/requirements.txt"
      notify: Restart the app

    - name: Install the pinned dependencies in the release's own venv
      ansible.builtin.pip:
        requirements: "{{ app_root }}/releases/{{ release_commit.stdout }}/requirements.txt"
        virtualenv: "{{ app_root }}/releases/{{ release_commit.stdout }}/venv"
        virtualenv_command: python3 -m venv

    # ── Configuration: non-secret values, read from Terraform at deploy time ──
    - name: Read Terraform outputs (the single source for endpoints and ports)
      ansible.builtin.command: terraform -chdir="{{ repo_root }}/infra/terraform" output -json
      delegate_to: localhost
      run_once: true
      register: tf_outputs
      changed_when: false

    - name: Keep the outputs as a fact
      ansible.builtin.set_fact:
        tf: "{{ tf_outputs.stdout | from_json }}"

    - name: Create the config directory
      ansible.builtin.file:
        path: /etc/shortify
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write the app environment (root-owned; group read for the app user)
      ansible.builtin.template:
        src: templates/shortify.env.j2
        dest: /etc/shortify/shortify.env
        owner: root
        group: "{{ app_user }}"
        mode: "0640"
      notify: Restart the app

    # ── Run the app: systemd on AWS; on Floci the same command, same user, same env ──
    - name: Create the app log directory (Floci launcher only; systemd uses the journal)
      ansible.builtin.file:
        path: /var/log/shortify
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"
      when: emulator_no_systemd | default(false)

    # Before anything can notify "Restart the app": its Floci handler runs this script,
    # and on a fresh instance the first flush would call a file that doesn't exist yet
    # (edge case #56).
    - name: "Floci only: install the control script (same command, zombie-aware, edge case #9)"
      ansible.builtin.template:
        src: templates/shortify-floci.sh.j2
        dest: /usr/local/sbin/shortify-floci
        owner: root
        group: root
        mode: "0755"
      when: emulator_no_systemd | default(false)
      notify: Restart the app

    - name: Install the systemd unit (the reboot-safe fix for edge case #19)
      ansible.builtin.template:
        src: templates/shortify.service.j2
        dest: /etc/systemd/system/shortify.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart the app

    - name: Apply pending restarts before starting (new release, unit or environment)
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the app with systemd
      ansible.builtin.systemd_service:
        name: shortify
        enabled: true
        state: started
        daemon_reload: true
      when: not (emulator_no_systemd | default(false))

    - name: "Floci only: start the app if it isn't running"
      ansible.builtin.command: /usr/local/sbin/shortify-floci start
      register: floci_start
      changed_when: "'started' in floci_start.stdout"
      when: emulator_no_systemd | default(false)

    - name: Verify the app answers (a deploy must not succeed while the app is down)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ tf.app_port.value }}/health"
      register: health
      retries: 12
      delay: 5
      until: health.status == 200

  handlers:
    - name: Restart the app
      ansible.builtin.systemd_service:
        name: shortify
        state: restarted
        daemon_reload: true
      when: not (emulator_no_systemd | default(false))

    - name: "Floci only: stop the running app so the start task launches the new one"
      ansible.builtin.command: /usr/local/sbin/shortify-floci stop
      register: floci_stop
      changed_when: "'stopped' in floci_stop.stdout"
      listen: Restart the app
      when: emulator_no_systemd | default(false)
