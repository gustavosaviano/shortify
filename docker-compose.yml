services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortify
      POSTGRES_PASSWORD: shortify
      POSTGRES_DB: shortify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortify"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://shortify:shortify@db:5432/shortify
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
